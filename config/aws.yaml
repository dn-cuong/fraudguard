# Ingest on your laptop → real AWS Kinesis (worker scores in the cloud)
http_addr: ":8080"

kinesis:
  stream_name: "fraudguard-payments"
  region: "us-east-1"
  endpoint: ""

# unused in kinesis mode, kept for completeness
redis_addr: "localhost:6379"
dynamo:
  region: "us-east-1"
  table_name: "fraudguard-transactions"
  endpoint: ""
rules:
  amount_high_usd: 2500
  velocity_card_limit: 5
  velocity_card_window: "1m"
  velocity_ip_limit: 20
  velocity_ip_window: "1m"
  decline_score: 80
  review_score: 40
worker_count: 32
worker_name: "local-ingest"
