services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000 || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: LocalStack for Kinesis (start with: docker compose --profile aws up -d)
  localstack:
    image: localstack/localstack:4.0
    profiles: ["aws"]
    ports:
      - "4566:4566"
    environment:
      - SERVICES=kinesis,dynamodb
      - DEFAULT_REGION=us-east-1
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/01-kinesis.sh"
