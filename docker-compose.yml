services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000 || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10

  # LocalStack for Kinesis. "aws" starts just this; "full" runs the whole
  # pipeline: docker compose --profile full up -d --build
  localstack:
    image: localstack/localstack:4.0
    profiles: ["aws", "full"]
    ports:
      - "4566:4566"
    environment:
      - SERVICES=kinesis,dynamodb
      - DEFAULT_REGION=us-east-1
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/01-kinesis.sh"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/health | grep -q '\"kinesis\": \"\\(available\\|running\\)\"'"]
      interval: 5s
      timeout: 3s
      retries: 30

  ingest:
    build:
      context: .
      args: { CMD: ingest }
    profiles: ["full"]
    command: ["-config", "/config/compose.yaml", "-mode", "kinesis"]
    ports:
      - "8080:8080"
    environment: &fake-aws
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb: { condition: service_started }
      localstack: { condition: service_healthy }

  worker:
    build:
      context: .
      args: { CMD: worker }
    profiles: ["full"]
    command: ["-config", "/config/compose.yaml"]
    ports:
      - "9090:9090"
    environment: *fake-aws
    depends_on:
      redis: { condition: service_healthy }
      dynamodb: { condition: service_started }
      localstack: { condition: service_healthy }
