name: Feature / improvement
description: New rule, infra change, or performance work
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
