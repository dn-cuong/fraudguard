name: Bug report
description: Something is scoring, deploying, or behaving wrong
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [ingest, worker, engine/rules, velocity (Redis), history (DynamoDB), stream (Kinesis), terraform, ansible, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the payment JSON and mode (local score / kinesis / AWS).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: shell
